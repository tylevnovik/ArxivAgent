name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Sync backend dependencies
        run: uv sync --extra dev
      - name: Run backend tests
        run: uv run pytest tests/backend -q
      - name: Compile backend sources
        run: uv run python -m compileall -q app.py core

  desktop:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Install desktop dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bun run test:unit
      - name: Build renderer
        run: bun run build
      - name: Electron E2E
        run: bun run test:e2e
      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-artifacts
          path: |
            desktop/test-results/
            desktop/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Build unpacked packaged app
        run: bun run pack
      - name: Packaged smoke
        run: bun run smoke:packaged
